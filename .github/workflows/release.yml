name: Release Desktop App

# M5：桌面端免安装包发布。打 tag（如 v1.1.0）触发；与 nuget-publish.yml（客户端库）并行执行。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-app:
    name: Publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained app
        run: >
          dotnet publish src/GeoServerDesktop.App/GeoServerDesktop.App.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output ./publish-${{ matrix.rid }}

      - name: Verify satellite and entrypoint present
        shell: pwsh
        run: |
          $dir = "publish-${{ matrix.rid }}"
          $exe = Get-ChildItem -Path $dir -Include 'GeoServerDesktop.App.exe','GeoServerDesktop.App' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error "未找到可入口 GeoServerDesktop.App(.exe)"; exit 1 }
          if (-not (Test-Path (Join-Path $dir 'zh'))) { Write-Error "缺少 zh 卫星目录（中文资源未随包发布）"; exit 1 }
          Write-Host "入口: $($exe.Name)；zh 卫星: $((Get-ChildItem (Join-Path $dir 'zh') | Measure-Object).Count) 个文件"

      - name: Zip (统一用 pwsh，三平台一致)
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $src = "publish-$rid"
          Compress-Archive -Path (Join-Path $src '*') -DestinationPath "GeoServerDesktop-$rid.zip" -Force
          Get-Item "GeoServerDesktop-$rid.zip" | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.rid }}
          path: GeoServerDesktop-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show packages
        run: ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GeoServerDesktop ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/GeoServerDesktop-win-x64.zip
            dist/GeoServerDesktop-linux-x64.zip
            dist/GeoServerDesktop-osx-arm64.zip
